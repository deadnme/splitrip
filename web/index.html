<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Split trip expenses with friends.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SpliTrip">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SpliTrip</title>
  <link rel="manifest" href="manifest.json">
  <!-- Shown instantly while Flutter downloads and starts; the app paints over it. -->
  <style>
    body { margin: 0; background: #fdfbff; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; font: 15px -apple-system, system-ui, sans-serif; color: #555; }
    #splash img { width: 180px; }
    #splash .spin { width: 28px; height: 28px; border: 3px solid #c7c4f5; border-top-color: #4f46e5; border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) { :root:not([data-theme=light]) body { background: #131318; } :root:not([data-theme=light]) #splash { color: #aaa; } }
    :root[data-theme=dark] body { background: #131318; } :root[data-theme=dark] #splash { color: #aaa; }
  </style>
  <!-- The in-app sun/moon choice (shared_preferences keeps it in localStorage), so the splash doesn't flash the other theme. -->
  <script>try { var t = JSON.parse(localStorage.getItem('flutter.theme')); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <div id="splash">
    <img src="assets/assets/logo.png" alt="SpliTrip">
    <div class="spin"></div>
    <div>Loading SpliTrip…</div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
